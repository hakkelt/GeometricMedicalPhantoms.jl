name: Build CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CLI - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact-name: geomphantoms-linux-x86_64.tar.xz
            exe-name: geomphantoms
            julia-cpu-target: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
          - os: macos-15-intel
            arch: x86_64
            artifact-name: geomphantoms-macos-x86_64.tar.xz
            exe-name: geomphantoms
            julia-cpu-target: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
          - os: macos-latest
            arch: aarch64
            artifact-name: geomphantoms-macos-aarch64.tar.xz
            exe-name: geomphantoms
            julia-cpu-target: "generic;apple-m1,clone_all"
          - os: windows-latest
            arch: x86_64
            artifact-name: geomphantoms-windows-x86_64.zip
            exe-name: geomphantoms.exe
            julia-cpu-target: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"

    env:
      JULIA_CPU_TARGET: ${{ matrix.julia-cpu-target }}

    steps:
      - uses: actions/checkout@v6

      - name: Set version string
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Install JuliaC (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        env:
          JULIA_NUM_THREADS: '1'
          JULIA_IMAGE_THREADS: '1'
          JULIA_NUM_PRECOMPILE_TASKS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          julia -e 'using Pkg; Pkg.add(Pkg.PackageSpec(name="JuliaC", version="0.3.1"))'

      - name: Install JuliaC (non-Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        run: |
          julia -e 'using Pkg; Pkg.add(Pkg.PackageSpec(name="JuliaC", version="0.3.1"))'

      - name: Show runner resources
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== CPU ==="
          nproc
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h .

      - name: Allocate swap space
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          swap_path=/mnt/gmp-swapfile
          current_swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
          target_swap_mb=11000
          if [[ "$current_swap_mb" -lt "$target_swap_mb" ]]; then
            sudo rm -f "$swap_path"
            sudo fallocate -l 8G "$swap_path"
            sudo chmod 600 "$swap_path"
            sudo mkswap "$swap_path"
            sudo swapon "$swap_path"
          else
            echo "Existing swap is already sufficient; skipping extra swap allocation."
          fi
          echo "=== Swap enabled ==="
          swapon --show
          free -h

      - name: Prepare CLI app dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        env:
          JULIA_NUM_THREADS: '1'
          JULIA_IMAGE_THREADS: '1'
          JULIA_NUM_PRECOMPILE_TASKS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Prepare CLI app dependencies (non-Ubuntu, non-Windows)
        if: runner.os != 'Windows' && matrix.os != 'ubuntu-latest'
        working-directory: app
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Remove GIFImages and instantiate (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: |
          julia --project=. -e 'using Pkg; Pkg.rm("GIFImages"); Pkg.instantiate()'

      - name: Build CLI executable (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: app
        shell: bash
        env:
          JULIA_NUM_THREADS: '1'
          JULIA_IMAGE_THREADS: '1'
          JULIA_NUM_PRECOMPILE_TASKS: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          (
            while true; do
              echo "=== Resource snapshot $(date -u +"%Y-%m-%dT%H:%M:%SZ") ==="
              free -h
              swapon --show
              sleep 30
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" || true' EXIT
          julia --project=. build.jl

      - name: Build CLI executable (non-Ubuntu)
        if: matrix.os != 'ubuntu-latest'
        working-directory: app
        run: |
          julia --project=. build.jl

      - name: Test executable
        working-directory: app
        run: |
          ./build/bin/${{ matrix.exe-name }} info

      - name: Run compiled binary integration tests
        working-directory: app
        run: |
          julia --project=. test/test_compiled_binary.jl ./build/bin/${{ matrix.exe-name }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        working-directory: app
        run: |
          tar -cjf ../${{ matrix.artifact-name }} build 

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build\* -DestinationPath ../${{ matrix.artifact-name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact-name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # ----------------------------------------------------------------
      # ---------------------- MATLAB toolbox --------------------------
      # ----------------------------------------------------------------

      - name: Setup MATLAB
        if: matrix.os == 'macos-latest'
        uses: matlab-actions/setup-matlab@v3

      - name: Run MATLAB smoke test
        if: matrix.os == 'macos-latest'
        uses: matlab-actions/run-command@v3
        with:
          command: >
            addpath('lib/test');
            smoke_test_matlab('${{ github.workspace }}/app/build/bin/${{ matrix.exe-name }}');

      - name: Build MATLAB toolbox
        if: matrix.os == 'macos-latest'
        uses: matlab-actions/run-command@v3
        with:
          command: >
            addpath('lib/matlab');
            build_toolbox('${{ steps.version.outputs.version }}', '.');

      - name: Upload MATLAB toolbox as artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: matlab-toolbox
          path: GeometricMedicalPhantoms-matlab.mltbx

      - name: Upload MATLAB toolbox to release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v3
        with:
          files: GeometricMedicalPhantoms-matlab.mltbx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
